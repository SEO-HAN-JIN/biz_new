<!--<!DOCTYPE html>-->
<!--<html lang="ko" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout/framelayout}">-->


<th:block th:fragment="content">

    <div class="page-heading">
        <div class="page-title">
            <div class="row">
                <div class="col-12 col-md-6 order-md-1 order-last p-3">
                    <h3>환불항목관리</h3>
                </div>
                <div class="col-12 col-md-6 order-md-2 order-first">
                    <nav aria-label="breadcrumb" class="breadcrumb-header float-start float-lg-end">
                        <ol class="breadcrumb">
                            <li class="breadcrumb-item">업무관리</li>
                            <li class="breadcrumb-item active" aria-current="page">환불항목관상</li>
                        </ol>
                    </nav>
                </div>
            </div>
        </div>

        <section id="horizontal-input">
            <div class="row">
                <div class="col-md-12">
                    <div class="card">
                        <div class="card-body pt-3 pb-3" id="searchForm">
<!--                            <div class="row align-items-center p-2" style="">-->
                            <div class="row align-items-center p-2 search-area custom-bg">
                                <div class="col-md-11">
                                    <div class="form-group row mb-0 align-items-center text-center">
                                        <label class="col-form-label col-lg-1 col-3">환불항목코드</label>
                                        <div class="col-lg-2 col-9">
                                            <input type="text" id="searchId" class="form-control form-control-sm" name="searchId" placeholder="환불항목코드">
                                        </div>
                                        <label class="col-form-label col-lg-1 col-3">환불항목명</label>
                                        <div class="col-lg-2 col-9">
                                            <input type="text" id="searchName" class="form-control form-control-sm" name="searchName" placeholder="환불항목명">
                                        </div>
                                        <label class="col-form-label col-lg-1 col-3">사용여부</label>
                                        <div class="col-lg-3 col-9">
                                            <div class="d-flex">
                                                <select class="form-select" id="searchUseInd" name="searchUseInd"></select>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                                <div class="col-md-1 text-end">
                                    <a href="#" class="btn btn-primary" id="searchBtn">조회</a>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </section>

        <section class="section">
            <div class="row" id="basic-table">
                <div class="col-12">
                    <div class="card">
                        <div class="card-header">
                            <h4 class="card-title">환불항목관리내역</h4>
                        </div>
                        <div class="card-body">
                            <div class="d-flex justify-content-end" style="width: 100%;">
                                <div class="d-flex pb-3 gap-1">
                                    <button type="button" class="btn btn-primary btn-sm" id="modalAddBtn" data-bs-toggle="modal" data-bs-target="#refundItemModal">추가</button>

                                    <button type="button" class="btn btn-secondary btn-sm" id="btnDeleteProductGrid">삭제</button>
                                </div>
                            </div>
                            <div id="productGrid" class="tui-grid"></div>
                        </div>

                        <!-- 상품 정보 모달 -->
                        <div class="modal fade" id="refundItemModal" tabindex="-1" role="dialog" aria-labelledby="refundItemModalTitle" aria-hidden="true" data-bs-backdrop="static">
                            <div class="modal-dialog modal-dialog-centered modal-dialog-scrollable modal-lg" role="document">
                                <div class="modal-content shadow-sm rounded-3 border-0">
                                    <div class="modal-header bg-primary text-white rounded-top">
                                        <h5 class="modal-title text-white" id="refundItemModalCenterTitle text-white">상품 정보</h5>
                                        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                                    </div>

                                    <div class="card-body p-4">
                                        <form id="productForm" class="form">
                                            <div class="row g-3 mb-3">
                                                <div class="col-md-4">
                                                    <label class="form-label" for="_refundItemPop_refundItemId">환불항목코드</label>
                                                    <input type="text" id="_refundItemPop_refundItemId" class="form-control" name="refundItemId" placeholder="환불항목코드 자동 생성" disabled>
                                                </div>
                                                <div class="col-md-4">
                                                    <label class="form-label" for="_refundItemPop_refundItemName">환불항목명</label>
                                                    <input type="text" id="_refundItemPop_refundItemName" class="form-control" name="refundItemName">
                                                </div>
                                                <div class="col-md-4">
                                                    <label class="form-label" for="_refundItemPop_useInd">사용여부</label>
                                                    <select class="form-select" id="_refundItemPop_useInd" name="useInd"></select>
                                                </div>
                                            </div>
                                        </form>

                                    </div>


                                    <!-- Modal Footer -->
                                    <div class="modal-footer bg-light rounded-bottom d-flex justify-content-end">
                                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
                                            닫기
                                        </button>
                                        <button type="button" class="btn btn-success ms-2" id="modalSaveBtn">
                                            💾 저장
                                        </button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </div>
    <script type="text/javascript">
        (function() {
        const apiUrl = '/api/pages/refunditem';
        const _popPrefix_ = '_refundItemPop_';

        let productGrid;

        let $isNew;
        let $needSearch = false;

        $(document).ready(function() {
            initEvent();
            findInitCodes();
        });

        const initEvent = () => {
            $("#modalAddBtn").on('click', function() {
                openProductPop('1');
            });
            $("#modalSaveBtn").on('click', fn_saveProductGrid);

            $("#searchBtn").on('click', searchProductGrid);
            $("#btnDeleteProductGrid").on('click', fn_deleteProductGrid);

            $("#searchForm").on('keydown', function(event) {
                if (event.key === "Enter") {
                    event.preventDefault(); // 폼의 기본 제출 방지
                    $("#searchBtn").click(); // 검색 버튼 클릭 트리거
                }
            });

            // 숫자 input 콤마 형식
            $(".priceformat").on('input', function(){
                var obj = $(this);
                obj.val(formatNumber(obj.val()));
            });

            $('.is-num').bind('keyup', numberKeyupEvent);

            $('#refundItemModal').on('shown.bs.modal', () => {

                if ($needSearch) {
                    searchProductModalGrid();
                }
            });
        }

        const findInitCodes = async () => {
            const param =
                [
                    {"patternCode": "SE06"}      // 사용여부
                ];

            const result = await CommonJs.initFindCodes(param);
            findCodeCallback(result);
        }

        const findCodeCallback = (result) => {
            let SE06Options;
            SE06Options=  {
                value: 'baseCode',
                text: 'codeName',
                items: result.SE06,
                placeholder: '전체'
            };
            $("#searchUseInd").addOptions(SE06Options);

            SE06Options = {
                value: 'baseCode',
                text: 'codeName',
                items: result.SE06,
                placeholder: '선택'
            };
            $("#_refundItemPop_useInd").addOptions(SE06Options);

            initProductGrid();
        }

        const initProductGrid = () => {


            var columns = new CustomTuiGrid()
                .add('refundItemId', '환불항목코드', 100, {})
                .add('refundItemName', '환불항목명', 150, {})
                .add('useIndName', '사용여부', 70, { align: 'center' })
                .add('useInd', '사용여부', 70, { visible: false })
                .setFitStyle('fill')  // 페이지 폭에 맞추어 그리드를 채우기

            productGrid = columns.init('productGrid', [])
                .render();

            // 더블 클릭 이벤트 설정
            productGrid.getGrid().on('dblclick', function(ev) {
                openProductPop('2');
            });

            searchProductGrid();
        }

        const searchProductGrid = () => {
            productGrid.clear();

            const param = {
                searchId : $("#searchId").val(),
                searchName : $("#searchName").val(),
                searchUseInd: $("#searchUseInd").val()
            };

            $.ajax({
                url: apiUrl,
                data: param,
                type: 'GET',
                success: (result) => {
                    if(result.length > 0) {
                        productGrid.bind(result);
                    }
                }
            });
        }

        // param : 1(추가버튼) , 2(그리드 더블클릭)
        const openProductPop = (param) => {

            clearForm('refundItemModal');

            // 셀 더블 버튼 클릭 시
            if (param === '2') {
                $isNew = false;
                $needSearch = true;


                const focusedCell = productGrid.getGrid().getFocusedCell();
                const focusedData = productGrid.getGrid().getRow(focusedCell.rowKey);

                $('#refundItemModal').bindForm(focusedData);

            } else {
                $isNew = true;
                $needSearch = false;

            }

            $('#refundItemModal').modal('show');
        }

        const clearForm = (id) => {
            $('#' + id).find('input, select, textarea').each(function () {
                if ($(this).is(':checkbox')) {
                    // 체크박스는 false로 설정
                    $(this).prop('checked', false);
                } else {
                    // 그 외의 입력 필드는 빈 문자열로 설정
                    $(this).val('');
                }
            });
        };


        const fn_saveProductGrid = () => {

            const param = {};
            $('#refundItemModal').find('input, select, input[type="checkbox"]').each((index, item) => {
                // checkbox일 때
                if ($(item).is(':checkbox')) {
                    param[item.name] = $(item).prop('checked') ? 'Y' : 'N'; // 체크 여부에 따라 Y 또는 N 설정
                } else {
                    // input일 때의 처리
                    param[item.name] = item.value.replace(/,/g, ''); // input 값 설정
                }
            });

            if (isNull(param.refundItemName)) {
                alert("환불항목명을 입력해주세요.");
                return false;
            }

            if (isNull(param.useInd)) {
                alert("사용여부를 선택해주세요.");
                return false;
            }

            if ($isNew) {
                param.rowStatus = "C";
            } else {
                param.rowStatus = "U";
            }

            if (confirm("데이터를 저장하시겠습니까?")) {
                return new Promise((resolve, reject) => {
                    $.ajax({
                        url: apiUrl,
                        data: JSON.stringify(param),
                        contentType: 'application/json',
                        type: 'POST',
                        success: (result) => {
                            if (result > 0) {
                                alert("저장이 완료되었습니다.");
                                $('#refundItemModal').modal('hide');
                                searchProductGrid();
                            } else {
                                alert("저장에 실패하였습니다.");
                                $('#refundItemModal').modal('hide');
                                searchProductGrid();
                            }
                        }, error: (xhr, status, error) => {
                            alert(xhr.responseText);
                            return false;
                        }
                    })
                });
            }
        }

        const fn_deleteProductGrid = () => {
            const focusedCell = productGrid.getGrid().getFocusedCell();
            if (isNull(focusedCell)) {
                alert("삭제할 행을 선택해주세요.");
                return;
            }

            const confirmResult = confirm("선택한 행의 데이터를 삭제하시겠습니까?");
            if (confirmResult) {
                const focusRow = productGrid.getGrid().getRow(focusedCell.rowKey);
                let params = {
                    refundItemId : focusRow.refundItemId,
                }
                $.ajax({
                    url: apiUrl,
                    data: JSON.stringify(params),
                    contentType:'application/json',
                    type: 'DELETE',
                    success: (result) => {
                        if (result > 0) {
                            alert("삭제가 완료되었습니다.");
                            searchProductGrid();
                        } else {
                            alert("삭제에 실패하였습니다.");
                            searchProductGrid();
                        }
                    }
                })
            }
        }
        })();
    </script>

</th:block>
